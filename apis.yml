description: >-
  CarMD specializes in automotive diagnostics and insights, selling the CarMD Connect vehicle-health
  device and publishing the CarMD Vehicle Health Index. Its developer story has two very different
  halves today. The historic CarMD Vehicle API (CarScan) — code definitions, vehicle images, repair
  and upcoming-issue prediction — is documented at api.carmd.com and still linked from the carmd.com
  footer, but that host refused TCP connections on ports 80 and 443 when probed on 2026-08-27, and the
  old carmd.com/api pricing page now returns 404. Meanwhile the rebuilt carmd.com storefront serves a
  live, anonymous agent surface: an llms.txt, a Universal Commerce Protocol merchant profile, a working
  MCP endpoint with thirteen commerce tools, and an anonymously introspectable Storefront GraphQL API.
apis:
  - aid: carmd:carmd
    name: CarMD Vehicle API
    tags:
      - Automobiles
      - Diagnostics
      - OBD-II
    humanURL: https://carmd.com/
    baseURL: https://api.carmd.com/
    properties: []
    description: >-
      CarMD's vehicle API (marketed as CarScan) provides access to OBD-II code definitions, vehicle
      images, repair information and predicted upcoming issues. Registration issues credentials that
      are sent on every request. STATUS 2026-08-27: unreachable. api.carmd.com DNS-resolves to
      54.86.119.234 but TCP 80 and 443 are both closed, so neither the documentation at
      api.carmd.com/member/docs nor the API itself could be reached from two independent networks.
      No machine-readable contract for this API is published anywhere this run could find.
  - aid: carmd:carmd-agentic-commerce
    name: CarMD Agentic Commerce API (UCP MCP)
    tags:
      - Agentic Commerce
      - MCP
      - E-Commerce
    humanURL: https://carmd.com/agents.md
    baseURL: https://carmd.com/api/ucp/mcp
    properties:
      - url: https://carmd.com/agents.md
        type: Documentation
      - url: mcp/carmd-mcp.yml
        type: MCPServer
      - url: mcp/carmd-tool-crosswalk.yml
        type: ToolCrosswalk
      - url: skills/carmd-agentic-purchase.md
        type: AgentSkill
    description: >-
      Live Model Context Protocol endpoint on CarMD's own domain, implementing the Universal Commerce
      Protocol (version 2026-04-08, with 2026-01-23 still served). Probed anonymously on 2026-08-27:
      initialize returned serverInfo universal-commerce 0.1.0 at MCP protocolVersion 2024-11-05, and
      tools/list returned 13 tools — catalog search and lookup, cart create/update/cancel, checkout
      create/update/complete/cancel, and order read — each with a JSON Schema 2020-12 inputSchema.
      Checkout completion requires contemporaneous human buyer approval. The server software is the
      Shopify platform UCP implementation; the endpoint, merchant identity and catalog are CarMD's.
  - aid: carmd:carmd-storefront-graphql
    name: CarMD Storefront GraphQL API
    tags:
      - E-Commerce
      - GraphQL
    humanURL: https://carmd.com/
    baseURL: https://carmd.com/api/2026-04/graphql.json
    properties:
      - url: graphql/carmd-storefront.graphql
        type: GraphQL
      - url: data-model/carmd-data-model.yml
        type: DataModel
    description: >-
      The Shopify-provided Storefront GraphQL API served on carmd.com, version 2026-04. Anonymous
      introspection on 2026-08-27 returned a 424-type schema (262 objects, 34 query fields, 41
      mutations), and an anonymous data query returned shop.name "CarMD" with primaryDomain
      https://carmd.com — confirming the endpoint belongs to this company. Catalog and content reads
      are open; customer-scoped fields require a customer access token or the OIDC flow at
      carmd.com/.well-known/openid-configuration.
