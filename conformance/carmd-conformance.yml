      This is a contract-level declaration, not a prose claim: the capability URNs and schema URLs are read
      straight from the provider's own discovery document, and the MCP endpoint they name answers.
  - id: obd-ii
    name: 'OBD-II diagnostic trouble codes (SAE J2012 / ISO 15031-6)'
    market: automotive diagnostics
    conforms: unverified
    signature: null
    note: >-
      CarMD's Vehicle API is built on OBD-II trouble codes and would be the natural place for this domain
      standard to appear in a contract. It could not be checked: api.carmd.com refused connections and
      publishes no machine-readable contract that this run could reach. Recorded as unverified rather than
      false — no penalty is implied.
