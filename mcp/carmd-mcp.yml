providerId: carmd
name: CarMD Universal Commerce (UCP) MCP Server
description: 'CarMD serves a live, anonymous Model Context Protocol endpoint on its own domain at https://carmd.com/api/ucp/mcp.
  It is the Shopify-provided Universal Commerce Protocol (UCP) commerce server for the CarMD store — it
  sells CarMD Connect hardware, not the CarMD Vehicle API. It was probed directly: `initialize` returned
  serverInfo {"name":"universal-commerce","version":"0.1.0"} with protocolVersion 2024-11-05, and `tools/list`
  returned 13 tools with full JSON Schema 2020-12 inputSchemas, saved verbatim to mcp/carmd-ucp-tools-list.json.
  No CarMD Vehicle API MCP server exists; the developer API host api.carmd.com refused connections at
  probe time.'
status: live
ownership: The endpoint is on carmd.com, the company's own primary domain, and an anonymous Storefront
  GraphQL query against the same host returns shop.name "CarMD" with primaryDomain https://carmd.com.
  The UCP profile's Google Pay handler carries merchant_name "CarMD" and merchant_origin carmd.com. The
  server software is Shopify's platform UCP implementation; the merchant, catalog and endpoint are CarMD's.
deployment:
  mode: remote
  endpoint: https://carmd.com/api/ucp/mcp
  auth: none
  verified: probed
  note: Anonymous. tools/list returned 200 with no credential. Tools require a `meta.ucp-agent.profile`
    URI in every call; a call without one returns JSON-RPC error -32001 "UCP discovery failed" (data.code
    invalid_profile_url) with HTTP 422. The UCP discovery document names an equivalent canonical endpoint
    at https://wayps3-ui.myshopify.com/api/ucp/mcp (the same store's myshopify alias).
protocol:
  jsonrpc: '2.0'
  mcp_protocol_version: '2024-11-05'
