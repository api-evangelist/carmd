provider: CarMD
providerId: carmd
description: >-
  Crosswalk between the two machine-readable surfaces CarMD actually serves: the UCP MCP server at
  https://carmd.com/api/ucp/mcp (13 tools) and the Storefront GraphQL API at
  https://carmd.com/api/2026-04/graphql.json (34 query fields, 41 mutations). There is no OpenAPI to bind
  to — the `rest` column is empty on every row for that reason, and the binding is expressed against
  GraphQL fields instead. Both surfaces are projections of the same Shopify commerce core, but they are not
  identical: the MCP surface exposes an order read and a checkout lifecycle the anonymous GraphQL surface
  does not, and GraphQL exposes content (blogs, articles, pages, menus, metaobjects) and customer-account
  mutations the MCP surface does not.
