description: >-
  CarMD publishes no API plans or pricing that this run could reach. The former CarMD API pricing page at
  https://www.carmd.com/api/ now returns 404 — the site was rebuilt on Shopify and the developer-facing
  content did not migrate. The remaining developer entry point, https://api.carmd.com/member/ (still linked
  from the carmd.com footer as "CarMD API"), refuses TCP connections on both 80 and 443. There is therefore
  no published tier, quota, overage or price to record.
