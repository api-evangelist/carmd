note: >-
  This file previously carried a three-tier Free/Professional/Enterprise scaffold written by the
  2026-05-04 bulk sweep with invented quotas (1,000 and 100,000 requests/month) and "TBD" prices. None of
  those numbers came from CarMD. They have been removed: an honest zero is data, an invented tier is not.
  CarMD's storefront does sell consumer hardware (CarMD Connect) with real prices via
  https://carmd.com/products/carmd-connect, but hardware SKUs are not API plans and are not recorded here.
